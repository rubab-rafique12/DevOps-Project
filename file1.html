<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First DevOops Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: white;
            width: 400px;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #4a4de7;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            font-size: 16px;
            background-color: #4a4de7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #292bb5;
        }

        #message {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Welcome to My Website!</h1>

        <p>
            This is my first beautiful HTML webpage.
                 "Its the updated version "
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <div id="message"></div>

    </div>

    <script>

        function showMessage() {

            document.getElementById("message").innerHTML =
                "🎉 Congratulations! Your code is working successfully!";

        }

    </script>

</body>
</html>
