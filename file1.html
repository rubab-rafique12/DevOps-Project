<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Pehla Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            margin-top: 50px;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #555;
            font-size: 18px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }

</head>
<body>

    <h1>Hello World!</h1>
    <p>Ye mera pehla basic HTML webpage hai.</p>

    <button onclick="showMessage()">Yahan Click Karein</button>

    <script>
        function showMessage() {
            alert("Welcome! Aapka code kamyabi se chal gaya hai.");
        }
    </script>

</body>
</html>
