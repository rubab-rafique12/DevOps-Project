```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First DevOops Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 420px;
            padding: 45px 35px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #4a4de7;
            margin-bottom: 12px;
            font-size: 30px;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
        }

        button {
            padding: 13px 30px;
            margin-top: 18px;
            font-size: 16px;
            font-weight: bold;

            background: #4a4de7;
            color: white;

            border: none;
            border-radius: 10px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #292bb5;
            transform: scale(1.05);
        }

        #message {
            margin-top: 20px;
            color: #2e8b57;
            font-weight: bold;
            font-size: 16px;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">💻</div>

        <h1>Welcome to My DevOops Project!</h1>

        <p>
            This is my first beautiful HTML web project.
            I am learning web development and GitHub.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <div id="message"></div>

        <div class="footer">
            Created by Salma Rani
        </div>

    </div>

    <script>

        function showMessage() {

            document.getElementById("message").innerHTML =
                "🎉 Great! Your code is working successfully!";
        }

    </script>

</body>
</html>
```
