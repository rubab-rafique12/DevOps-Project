<!DOCTYPE html>
<html>
<head>
    <title>DevOps Project</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>DevOps Docker Compose Project</h1>

    <p>Frontend: Nginx</p>
    <p>Backend: Node.js + Express</p>

    <button onclick="module1()">Module 1</button>
    <button onclick="module2()">Module 2</button>

    <div id="result"></div>

    <script>

        function module1() {
            fetch("http://localhost:5000/api/module1")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("result").innerHTML = `
                        <h2>${data.name}</h2>
                        <p>Student: ${data.student}</p>
                        <p>Roll No: ${data.rollNo}</p>
                        <p>Program: ${data.program}</p>
                        <p>Semester: ${data.semester}</p>
                    `;
                });
        }

        function module2() {
            fetch("http://localhost:5000/api/module2")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("result").innerHTML = `
                        <h2>${data.name}</h2>
                        <p>Technology: ${data.technology}</p>
                        <p>Frontend: ${data.frontend}</p>
                        <p>Backend: ${data.backend}</p>
                        <p>Status: ${data.status}</p>
                    `;
                });
        }

    </script>

</body>
</html>
